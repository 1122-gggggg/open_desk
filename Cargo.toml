[workspace]
resolver = "2"
members = [
    "apps/client",
    "apps/host",
    "apps/identity",
    "apps/lab",
    "apps/stress",
    "apps/udp-loopback",
    "crates/codec",
    "crates/frame",
    "crates/h264",
    "crates/input",
    "crates/media",
    "crates/platform",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/protocol",
    "crates/runtime",
    "crates/scheduler",
    "crates/session",
    "crates/socket-transport",
    "crates/surface",
    "crates/telemetry",
    "crates/test-codec",
    "crates/testkit",
    "crates/transport",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1122-gggggg/open_desk"
authors = ["LatencyDesk contributors"]


[workspace.dependencies]
bytes = "=1.12.1"
getrandom = "0.2"
quinn = { version = "=0.11.8", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.8"
subtle = "2.6.1"
tokio = { version = "=1.44.2", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8.2"
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
