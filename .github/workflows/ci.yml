name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/static_validate.py
      - run: python3 scripts/source_sanity.py
      - run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python3 scripts/reference_lab.py --fuzz-iterations 100000

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install Linux build and process-smoke dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxtst-dev iproute2 nftables util-linux
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Deterministic multi-session and input-priority stress gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/ci
          cargo run --quiet --locked -p latencydesk-stress > artifacts/ci/multisession-stress.json
          python3 -c 'import json, pathlib; data = json.loads(pathlib.Path("artifacts/ci/multisession-stress.json").read_text()); assert data["schema"] == 1; assert data["concurrent_sessions"] == 8; assert data["profile_runs"] == data["unique_session_profile_runs"] == 32; assert data["submitted_frames"] == data["completed_frames"] + data["incomplete_frames"] + data["exact_mismatches"]; assert data["exact_mismatches"] == 0; assert data["max_input_service_pops"] == 1'
      - name: Build secure process-smoke binaries
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked -p latencydesk-host -p latencydesk-client -p latencydesk-identity -p latencydesk-rendezvousd -p latencydesk-turn-relayd -p latencydesk-route-probe -p latencydesk-product-probe
      - name: Two-path exact-mTLS promotion and rollback process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/ci
          python3 scripts/route_promotion_process_test.py \
            --binary target/debug/latencydesk-route-probe \
            --identity-bin target/debug/latencydesk-identity \
            --timeout 20 --output artifacts/ci/route-promotion-process.json
      - name: Upload route promotion process evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: route-promotion-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/route-promotion-process.json
          if-no-files-found: error
          retention-days: 30
      - name: Exact-mTLS rendezvous process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/ci
          python3 scripts/rendezvous_process_test.py \
            --server-bin target/debug/latencydesk-rendezvousd \
            --client-bin target/debug/latencydesk-rendezvous-client \
            --identity-bin target/debug/latencydesk-identity \
            --timeout 20 --output artifacts/ci/rendezvous-process.json
      - name: Upload rendezvous process evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rendezvous-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/rendezvous-process.json
          if-no-files-found: error
          retention-days: 30
      - name: Concurrent exact-mTLS rendezvous multi-match smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/rendezvous_multi_process_test.py \
            --server-bin target/debug/latencydesk-rendezvousd \
            --client-bin target/debug/latencydesk-rendezvous-client \
            --identity-bin target/debug/latencydesk-identity \
            --timeout 20 --output artifacts/ci/rendezvous-multi-process.json
      - name: Upload concurrent rendezvous evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rendezvous-multi-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/rendezvous-multi-process.json
          if-no-files-found: error
          retention-days: 30
      - name: Bounded RFC 8656 UDP TURN relay process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/turn_relay_process_test.py \
            --server-bin target/debug/latencydesk-turn-relayd \
            --client-bin target/debug/latencydesk-turn-client \
            --timeout 20 --output artifacts/ci/turn-relay-process.json
      - name: Upload TURN relay process evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: turn-relay-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/turn-relay-process.json
          if-no-files-found: error
          retention-days: 30
      - name: Forced TURN exact-mTLS ProductSession smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/turn_product_process_test.py \
            --relay-bin target/debug/latencydesk-turn-relayd \
            --probe-bin target/debug/latencydesk-product-probe \
            --identity-bin target/debug/latencydesk-identity \
            --timeout 20 --output artifacts/ci/turn-product-process.json
      - name: Upload forced TURN product evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: turn-product-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/turn-product-process.json
          if-no-files-found: error
          retention-days: 30
      - name: Isolated NAT behavior and exact-mTLS ProductSession matrices
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/nat_netns_matrix.py run --allow-netns \
            --output artifacts/ci/nat-behavior-matrix.json
          python3 scripts/nat_product_netns_test.py --allow-netns \
            --probe-bin target/debug/latencydesk-product-probe \
            --identity-bin target/debug/latencydesk-identity \
            --profiles lan-v4 eim-eif double-nat cgnat native-v6 \
            --output artifacts/ci/nat-product-matrix.json
      - name: Upload isolated NAT product evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nat-product-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/nat-behavior-matrix.json
            artifacts/ci/nat-product-matrix.json
          if-no-files-found: error
          retention-days: 30
      - name: Secure QUIC/mTLS X11 process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/ci
          xvfb-run -a python3 scripts/secure_connect_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --frames 3 --fps 10 --max-width 320 --max-height 180 \
            --pairing-timeout 30 \
            --output artifacts/ci/secure-connect.json
      - name: Upload secure process-smoke evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: secure-process-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/secure-connect.json
          if-no-files-found: error
          retention-days: 30
      - name: Same-socket STUN to exact-mTLS QUIC process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a python3 scripts/stun_same_socket_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --frames 3 --timeout 45 \
            --output artifacts/ci/stun-same-socket.json
      - name: Upload same-socket STUN evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: stun-same-socket-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/stun-same-socket.json
          if-no-files-found: error
          retention-days: 30
      - name: Isolated ICE connectivity probe process smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/ci
          xvfb-run -a python3 scripts/ice_connectivity_probe_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --frames 3 --timeout 45 --output artifacts/ci/ice-connectivity-probe.json
      - name: Upload ICE connectivity probe evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ice-connectivity-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/ice-connectivity-probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Secure XTEST input application-ACK latency smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a python3 scripts/secure_input_latency_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --samples 128 --timeout 30 \
            --output artifacts/ci/secure-input-latency.json
      - name: Upload secure input latency evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: secure-input-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/secure-input-latency.json
          if-no-files-found: error
          retention-days: 30
      - name: Concurrent two-target XTEST input application-ACK latency smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a python3 scripts/multi_target_input_latency_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --samples 256 --timeout 45 \
            --output artifacts/ci/multi-target-input-latency.json
      - name: Upload concurrent two-target input latency evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multi-target-input-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/multi-target-input-latency.json
          if-no-files-found: error
          retention-days: 30
      - name: Concurrent 4/8/16-target input latency and process-resource scale
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target_count in 4 8 16; do
            samples=256
            if [ "$target_count" -ge 8 ]; then
              # Keep every process alive through both fail-closed /proc snapshots.
              samples=1024
            fi
            xvfb-run -a python3 scripts/multi_target_input_latency_test.py \
              --host-bin target/debug/latencydesk-host \
              --client-bin target/debug/latencydesk-client \
              --identity-bin target/debug/latencydesk-identity \
              --target-count "$target_count" --samples "$samples" --timeout 120 \
              --output "artifacts/ci/multi-target-input-latency-${target_count}.json"
          done
      - name: Upload concurrent input latency scale evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multi-target-input-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/multi-target-input-latency-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Multi-target supervisor cancellation and process cleanup gate
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        run: |
          xvfb-run -a python3 scripts/multi_target_cancel_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --output artifacts/ci/multi-target-cancel.json
      - name: Upload multi-target cancellation evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multi-target-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/multi-target-cancel.json
          if-no-files-found: error
          retention-days: 30
      - name: Abrupt QUIC path-loss recovery smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a python3 scripts/abrupt_reconnect_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --frames 3 --drop-seconds 4 \
            --output artifacts/ci/abrupt-reconnect.json
      - name: Upload abrupt reconnect evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: abrupt-reconnect-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/abrupt-reconnect.json
          if-no-files-found: error
          retention-days: 30
      - name: Concurrent multi-target isolation smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a python3 scripts/multi_target_connect_test.py \
            --host-bin target/debug/latencydesk-host \
            --client-bin target/debug/latencydesk-client \
            --identity-bin target/debug/latencydesk-identity \
            --frames 5 --fps 10 --max-width 320 --max-height 180 \
            --output artifacts/ci/multi-target-connect.json
      - name: Upload concurrent multi-target evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multi-target-connect-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/multi-target-connect.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload deterministic multi-session evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multisession-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/multisession-stress.json
          if-no-files-found: error
          retention-days: 30
      - name: Build Linux lab-preview package
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/package.sh --lab-preview --out-dir artifacts/package-ci
      - name: Build Windows lab-preview package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\package.ps1 -LabPreview -OutDir artifacts/package-ci
      - name: Upload lab-preview package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-preview-package-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/package-ci
          if-no-files-found: error
          retention-days: 14

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev ffmpeg
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Native conformance tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Runtime capability report
        run: ./build/native/native/latencydesk_linux_capability_probe
      - name: Low-delay H.264 correctness probe
        run: python3 scripts/ffmpeg_h264_probe.py --encoder libx264 --frames 60

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create native evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/ci/windows-native | Out-Null
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/native -A x64 2>&1 | Tee-Object -FilePath artifacts/ci/windows-native/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build/native --config Release --parallel 2 2>&1 | Tee-Object -FilePath artifacts/ci/windows-native/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native conformance tests
        shell: pwsh
        run: |
          ctest --test-dir build/native -C Release --output-on-failure 2>&1 | Tee-Object -FilePath artifacts/ci/windows-native/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/windows-native
          if-no-files-found: warn
          retention-days: 30
