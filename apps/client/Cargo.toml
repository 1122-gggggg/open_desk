[package]
name = "latencydesk-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
latencydesk-codec = { path = "../../crates/codec" }
latencydesk-h264 = { path = "../../crates/h264" }
latencydesk-input = { path = "../../crates/input" }
latencydesk-media = { path = "../../crates/media" }
latencydesk-platform = { path = "../../crates/platform" }
latencydesk-protocol = { path = "../../crates/protocol" }
latencydesk-runtime = { path = "../../crates/runtime" }
latencydesk-session = { path = "../../crates/session" }
latencydesk-socket-transport = { path = "../../crates/socket-transport" }
latencydesk-surface = { path = "../../crates/surface" }
latencydesk-transport = { path = "../../crates/transport" }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
latencydesk-platform-windows = { path = "../../crates/platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
latencydesk-platform-linux = { path = "../../crates/platform-linux" }

[lints]
workspace = true
